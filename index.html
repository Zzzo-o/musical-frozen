            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;

        }
        .schedule-wrapper.collapsed {
            max-height: 0;
            opacity: 0;
        }
        .schedule-scroll {
            max-height: 160px;
            overflow-y: auto;

        }

            text-align: center;

            background: #1e293b;

            padding: 5px 2px;

    </section>

    </section>

            const wrapper = document.getElementById('scheduleWrapper');

            if (wrapper.classList.contains('collapsed')) {

                btn.innerText = '접기 ▲';
            } else {

        function renderSchedule() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';
            fullSchedule.forEach(item => {
                const dateObj = new Date(item.date);
                const dayName = days[dateObj.getDay()];

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.date.slice(5)}(${dayName})</td>
                    <td>${item.time}</td>
                    <td>${item.elsa}</td>
                    <td style="color:#38bdf8; font-weight:bold;">${item.anna}</td>
                    <td>${item.kris}</td>

                };

            });
        }

        function updatePrice() {
            const gradePrice = parseInt(document.getElementById('seatGrade').value);
            const discountSelect = document.getElementById('discountType');
            const discountRate = parseFloat(discountSelect.value);
            const ticketCount = parseInt(discountSelect.options[discountSelect.selectedIndex].getAttribute('data-count') || '1');
            const feePerTicket = 2000;

            const baseTotal = gradePrice * ticketCount;
            const calculated = Math.floor(baseTotal * (1 - discountRate)) + (feePerTicket * ticketCount);
            
            document.getElementById('finalPriceDisplay').value = `${calculated.toLocaleString()}원 (수수료 포함)`;
            return calculated;
        }

        function addRecord() {
            const dateVal = document.getElementById('watchDate').value;
            const seatVal = document.getElementById('selectSeat').value;
            const priceVal = updatePrice();

            if (!dateVal || !seatVal) return;

            const record = {
                id: Date.now(),
                datetime: dateVal,
                seat: seatVal,
                price: priceVal
            };

            myRecords.push(record);
            localStorage.setItem('frozenCalcRecords', JSON.stringify(myRecords));
            
            const seatKey = seatVal.split(' (')[0];
            const currentCount = seatWatchStatus[seatKey] || 0;
            seatWatchStatus[seatKey] = currentCount + 1;
            localStorage.setItem('frozenSeatWatchStatus', JSON.stringify(seatWatchStatus));

            renderRecords();
            buildGradeSeatMap();
            document.getElementById('selectSeat').value = '';
        }

        function renderRecords() {
            const container = document.getElementById('recordContainer');
            container.innerHTML = '';

            let total = 0;
            myRecords.forEach((item) => {
                total += item.price;

                const card = document.createElement('div');
                card.className = 'record-card';
                card.innerHTML = `
                    <div class="record-header">
                        <span>${item.datetime}</span>
                        <span class="record-price" style="color:#38bdf8;">${item.price.toLocaleString()}원</span>
                    </div>
                    <div>좌석: ${item.seat}</div>
                    <button class="delete-btn" onclick="deleteRecord(${item.id})">삭제</button>
                `;
                container.appendChild(card);
            });

            document.getElementById('totalCount').innerText = myRecords.length;
            document.getElementById('totalAmount').innerText = total.toLocaleString();
        }

        function deleteRecord(id) {
            const target = myRecords.find(r => r.id === id);
            if (target) {
                const seatKey = target.seat.split(' (')[0];
                if (seatWatchStatus[seatKey] && seatWatchStatus[seatKey] > 0) {
                    seatWatchStatus[seatKey] -= 1;
                    if (seatWatchStatus[seatKey] === 0) delete seatWatchStatus[seatKey];
                    localStorage.setItem('frozenSeatWatchStatus', JSON.stringify(seatWatchStatus));
                }
            }
            myRecords = myRecords.filter(r => r.id !== id);
            localStorage.setItem('frozenCalcRecords', JSON.stringify(myRecords));
            renderRecords();
            buildGradeSeatMap();

        function getGradeFromImage(floor, row, num) {
            if (floor === '1층') {
                const rNum = parseInt(row);
                if (row === 'OP') return { cls: 'c-vip', label: 'VIP석' };

                if (rNum >= 1 && rNum <= 18) {
                    if (num >= 8 && num <= 37) return { cls: 'c-vip', label: 'VIP석' };
                    return { cls: 'c-r', label: 'R석' };
                }
                if (rNum === 19) return { cls: 'c-r', label: 'R석' };
                if (rNum === 20) {
                    if ((num >= 9 && num <= 14) || (num >= 31 && num <= 37)) {
                        return { cls: 'c-disabled', label: '휠체어석' };
                    }
                    return { cls: 'c-r', label: 'R석' };
                }
                if (rNum === 21) {
                    return { cls: 'c-r', label: 'R석' };
                }
            }

            if (floor === '2층') {
                const rNum = parseInt(row);
                
                if (rNum === 1 || rNum === 2) {
                    if ((num >= 9 && num <= 14) || (num >= 15 && num <= 30) || (num >= 31 && num <= 36)) {
                        return { cls: 'c-vip', label: 'VIP석' };
                    }
                    return { cls: 'c-r', label: 'R석' };
                }
                if (rNum >= 3 && rNum <= 5) return { cls: 'c-r', label: 'R석' };
                if (rNum >= 6 && rNum <= 10) return { cls: 'c-s', label: 'S석' };
                if (rNum >= 11 && rNum <= 12) return { cls: 'c-a', label: 'A석' };
            }

            return { cls: 'c-vip', label: 'VIP석' };
        }

        function renderFloorRows(targetElem, floorData, floorTitle) {
            targetElem.innerHTML = '';

            floorData.forEach(rData => {
                const rowWrapper = document.createElement('div');
                rowWrapper.className = 'seat-row-wrapper';

                const rowNum = document.createElement('div');
                rowNum.className = 'row-num';
                rowNum.innerText = rData.row;
                rowWrapper.appendChild(rowNum);

                ['a', 'b', 'c'].forEach((secKey, idx) => {
                    const secBlock = document.createElement('div');
                    secBlock.className = 'seat-section-block';

                    const secName = secKey === 'a' ? 'A구역' : (secKey === 'b' ? 'B구역' : 'C구역');
                    const seatArr = rData[secKey];

                    seatArr.forEach((num, sIdx) => {
                        const cell = document.createElement('div');
                        const gInfo = getGradeFromImage(floorTitle, rData.row, num);
                        const seatKey = `${floorTitle} ${secName} ${rData.row}열 ${num}번`;
                        
                        const watchCount = seatWatchStatus[seatKey] || 0;
                        let watchClass = '';
                        if (watchCount === 1) watchClass = 'c-watch-1';
                        else if (watchCount === 2) watchClass = 'c-watch-2';
                        else if (watchCount >= 3) watchClass = 'c-watch-3';

                        cell.className = `seat-cell ${watchClass || gInfo.cls}`;
                        if (rData.isGrouped222 && (sIdx === 1 || sIdx === 3)) {
                            cell.classList.add('gap-222');
                        }
                        cell.innerText = num;

                        cell.onclick = () => {
                            document.getElementById('selectSeat').value = `${seatKey} (${gInfo.label})`;
                            
                            const selectGrade = document.getElementById('seatGrade');
                            if (gInfo.label === 'VIP석') selectGrade.value = '190000';
                            else if (gInfo.label === 'R석') selectGrade.value = '160000';
                            else if (gInfo.label === 'S석') selectGrade.value = '130000';
                            else if (gInfo.label === 'A석') selectGrade.value = '90000';
                            updatePrice();
                        };

                        secBlock.appendChild(cell);
                    });

                    rowWrapper.appendChild(secBlock);

                    if (idx < 2) {
                        const aisle = document.createElement('div');
                        aisle.className = 'aisle-space';
                        rowWrapper.appendChild(aisle);
                    }
                });

                targetElem.appendChild(rowWrapper);
            });
